name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# The job only reads the repo; deploy auth is the SSH key, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DOCROOT: domains/hollandsvastgoedfonds.com/public_html
    steps:
      # Pinned to commit SHAs: a moved tag can't swap in code that sees SSH_KEY.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Check build output
        run: |
          test -f out/index.html
          test -f out/en/index.html
          test -f out/.htaccess
          test -f out/api/lead.php
          test -f out/sitemap.xml

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key (not ssh-keyscan at deploy time, which trusts
          # whatever answers and would hand the site to a MITM).
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Only this domain's docroot is touched: the hosting account is shared
      # with other sites. Leads live in ~/hollands_data, outside the docroot.
      - name: Upload site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -p $SSH_PORT -o IdentitiesOnly=yes"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p ~/hollands_data && chmod 700 ~/hollands_data && test -d ~/$DOCROOT"
          rsync -az --delete --delay-updates -e "$SSH" out/ "$SSH_USER@$SSH_HOST:$DOCROOT/"

      - name: Smoke test
        working-directory: .
        run: |
          sleep 5
          for p in / /en/ /werkwijze/ /wat-wij-kopen/woningen/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hollandsvastgoedfonds.com$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s https://hollandsvastgoedfonds.com/ | grep -q "Hollands Vastgoedfonds"
          echo "::notice::LIVE at https://hollandsvastgoedfonds.com/"

      # Tell Bing/Yandex/Seznam (IndexNow) about every URL in the sitemap so
      # changes are recrawled within hours. Failure here never fails the deploy.
      - name: Ping IndexNow
        working-directory: .
        continue-on-error: true
        run: |
          KEY=$(grep -oE 'INDEXNOW_KEY = "[0-9a-f]+"' frontend/src/data/site.js | grep -oE '[0-9a-f]{32}')
          URLS=$(curl -s https://hollandsvastgoedfonds.com/sitemap.xml | grep -oE '<loc>[^<]+' | sed 's/<loc>//' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"hollandsvastgoedfonds.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://hollandsvastgoedfonds.com/$KEY.txt\",\"urlList\":$URLS}"

